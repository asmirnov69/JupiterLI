[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jupiterli"
version = "0.1.4"
dependencies = [
    "redis", "clickhouse-driver",
    "nicegui",
    "plotly",
    "rdflib",
    "pyshacl",
]

[project.scripts]
jupiterli-backend = "jupiterli.backend.cli:main" # backend

[tool.setuptools.packages.find]
include = ["jupiterli*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
jupiterli = ["backend/ttl/*.ttl"]
