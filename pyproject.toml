[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jupiterli"
version = "0.2.0"
dependencies = [
    "pyzmq", "clickhouse-driver",
    "nicegui", "plotly",
    "rdflib", "pyshacl",
]

[project.scripts]
jupiterli-nicegui = "jupiterli.nicegui.cli:main" # nicegui webapp for browser use

[tool.setuptools.packages.find]
include = ["jupiterli*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
jupiterli = ["backend/ttl/*.ttl"]
