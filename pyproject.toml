[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jupiterli"
version = "0.2.2"
dependencies = [
    "click", "podman",
    "redis", "clickhouse-driver",
    "nicegui",
    "plotly",
    "rdflib",
    "pyshacl",
]

[project.scripts]
jupiterli-nicegui = "jupiterli.nicegui.cli:main" # nicegui backend
jupiterli-podman = "jupiterli.podman.cli:main" # jupiterli backend

[tool.setuptools.packages.find]
include = ["jupiterli*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
jupiterli = ["nicegui/ttl/*.ttl", "podman/docker/*"]
