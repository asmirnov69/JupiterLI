[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jupiterli"
version = "0.2.4"
dependencies = [
    "typer",
    "redis", "clickhouse-driver",
    "rdflib", "pyshacl",
]

[project.scripts]
jupiterli-podman = "jupiterli.podman.cli:main" # jupiterli backend

[tool.setuptools.packages.find]
include = ["jupiterli*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
jupiterli = ["podman/docker/*"]
